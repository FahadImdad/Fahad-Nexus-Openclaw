<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Try Instant Fit — Brochure</title>
<meta name="description" content="Try Instant Fit — AI-powered virtual try-on for modern fashion businesses. Tri-fold brochure.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%237b5cf0'/%3E%3Ctext x='32' y='45' font-family='Arial,sans-serif' font-size='38' font-weight='bold' fill='white' text-anchor='middle'%3ET%3C/text%3E%3C/svg%3E">
<style>
:root{--ink:#14143c;--vio:#7b5cf0;--blue:#4f7df9;}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:#191722;background-image:radial-gradient(1100px 500px at 50% -8%,#2a2540,transparent 62%);font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;color:#e7e4f2;-webkit-font-smoothing:antialiased;padding:24px 14px 60px;min-height:100vh}
.toolbar{max-width:1123px;margin:0 auto 18px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.toolbar .tt{font-size:12px;letter-spacing:.13em;text-transform:uppercase;font-weight:700;color:#a49fc0}
.toolbar .tt b{color:#fff}
.printbtn{font-weight:800;font-size:13px;color:#fff;background:linear-gradient(135deg,var(--vio),var(--blue));border:none;border-radius:10px;padding:10px 18px;cursor:pointer;box-shadow:0 6px 18px rgba(102,80,220,.45)}
.stage{max-width:1123px;margin:0 auto;width:100%}
.frame{width:100%;margin:0 auto 28px}
.frame .cap{font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:800;color:#8f89ad;margin:0 0 8px 2px}
.sheet{position:relative;width:100%;aspect-ratio:842/596;border-radius:6px;overflow:hidden;box-shadow:0 28px 70px rgba(0,0,0,.55);background:#f4f1fa}
.sheet img.page{position:absolute;inset:0;width:100%;height:100%;display:block}
.hot{position:absolute;display:block;border-radius:8px}
.hot:hover{outline:2px solid rgba(123,92,240,.75);outline-offset:1px;background:rgba(123,92,240,.08)}
.foot{max-width:1123px;margin:6px auto 0;text-align:center;font-size:11px;color:#736d92;letter-spacing:.08em}
.foot a{color:#a79ef0;text-decoration:none}
@media print{
  body{background:#fff;padding:0}
  .toolbar,.frame .cap,.foot{display:none}
  .stage{max-width:none}
  .frame{margin:0}
  .sheet{width:297mm;height:210mm;aspect-ratio:auto;border-radius:0;box-shadow:none;page-break-after:always;break-after:page}
  .hot:hover{outline:none;background:none}
  @page{size:A4 landscape;margin:0}
}
</style>
</head>
<body>

<div class="toolbar">
  <div class="tt"><b>Try Instant Fit</b> &mdash; Scan &amp; Wear Brochure &middot; A4 Landscape &middot; 2 Pages</div>
  <button class="printbtn" onclick="window.print()">Print / Save as PDF</button>
</div>

<div class="stage">

    <div class="sheet">

      <!-- clickable hotspots -->
      <a class="hot" href="https://tryinstantfit.com/scan/zJCHQ3nBfQ" target="_blank" rel="noopener" title="Scan &amp; Try It Now" style="left:3.2%;top:48.5%;width:8.2%;height:11.4%"></a>
      <a class="hot" href="https://tryinstantfit.com/scan/zJCHQ3nBfQ" target="_blank" rel="noopener" title="Your Try-On Link" style="left:12.3%;top:51.7%;width:15%;height:4%"></a>

      <a class="hot" href="https://tryinstantfit.com" target="_blank" rel="noopener" title="tryinstantfit.com" style="left:71.6%;top:77.2%;width:12.2%;height:2.4%"></a>
      <a class="hot" href="https://wa.me/923223146800" target="_blank" rel="noopener" title="WhatsApp +92 322 3146800" style="left:71.6%;top:80.1%;width:12.2%;height:2.4%"></a>
      <a class="hot" href="https://instagram.com/tryinstantfit" target="_blank" rel="noopener" title="instagram.com/tryinstantfit" style="left:71.6%;top:83.0%;width:12.2%;height:2.4%"></a>
      <a class="hot" href="https://facebook.com/tryinstantfit" target="_blank" rel="noopener" title="facebook.com/tryinstantfit" style="left:71.6%;top:86.0%;width:12.2%;height:2.4%"></a>
      <a class="hot" href="https://x.com/tryinstantfit" target="_blank" rel="noopener" title="x.com/tryinstantfit" style="left:71.6%;top:88.9%;width:12.2%;height:2.4%"></a>
      <a class="hot" href="https://tryinstantfit.com" target="_blank" rel="noopener" title="Scan &amp; Visit Website now" style="left:85.2%;top:76.9%;width:5.9%;height:9.6%"></a>
    </div>
  </div>

  <div class="frame">
    <p class="cap">Back &mdash; Brand Poster</p>
    <div class="sheet">
      <img class="page" src="assets/page2.jpg" alt="Try Instant Fit — See it. Love it. Wear it. AI-powered virtual try-on for modern fashion businesses">
      <a class="hot" href="https://tryinstantfit.com" target="_blank" rel="noopener" title="www.tryinstantfit.com" style="left:35.5%;top:96%;width:31.8%;height:3.6%"></a>
    </div>
  </div>

</div>

<p class="foot">Links, QR codes and buttons on the brochure are clickable &middot; <a href="https://tryinstantfit.com" target="_blank" rel="noopener">tryinstantfit.com</a></p>

</body>
</html>
